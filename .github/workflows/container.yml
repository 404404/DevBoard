name: Container

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Container acceptance (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: devboard:smoke
      - name: Fresh install, HTTP, health, restart, persistence and backup restore
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID:-local}-${PLATFORM//\//-}"
          volume="devboard-smoke-data-${suffix}"
          container="devboard-smoke-${suffix}"
          proxy="devboard-proxy-${suffix}"
          restore_container="devboard-restore-${suffix}"
          network="devboard-smoke-net-${suffix}"
          cert_directory="$RUNNER_TEMP/devboard-ci-certs-${suffix}"
          cleanup() {
            docker rm -f "$container" "$proxy" "$restore_container" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
            docker volume rm -f "$volume" >/dev/null 2>&1 || true
            rm -f "$cert_directory/fullchain.pem" "$cert_directory/privkey.pem"
            rmdir "$cert_directory" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          docker network create --subnet 172.30.87.0/24 "$network" >/dev/null
          mkdir -m 755 "$cert_directory"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=reverse-proxy' \
            -addext 'subjectAltName=DNS:devboard.example.test' \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -keyout "$cert_directory/privkey.pem" -out "$cert_directory/fullchain.pem" >/dev/null 2>&1
          chmod 600 "$cert_directory/privkey.pem"
          chmod 644 "$cert_directory/fullchain.pem"
          run_app() {
            docker run -d --name "$container" \
              --platform "$PLATFORM" \
              --network "$network" --ip 172.30.87.3 --network-alias devboard \
              --read-only \
              --security-opt no-new-privileges:true \
              --cap-drop ALL \
              --tmpfs /tmp:rw,noexec,nosuid,size=64m \
              -p 127.0.0.1:47823:47823 \
              -e CODEXBOARD_AUTH_MODE=web \
              -e DEVBOARD_PUBLIC_ORIGIN=https://devboard.example.test \
              -e DEVBOARD_TRUST_PROXY=172.30.87.2/32 \
              -e CODEXBOARD_SSE_HEARTBEAT_MS=1000 \
              -e DEVBOARD_DATA_DIR=/var/lib/devboard \
              -v "$volume:/var/lib/devboard" \
              -v "$cert_directory/fullchain.pem:/tmp/ci-fullchain.pem:ro" \
              devboard:smoke >/dev/null
          }
          wait_healthy() {
            for attempt in $(seq 1 60); do
              health="$(docker inspect --format '{{.State.Health.Status}}' "$container" 2>/dev/null || true)"
              if [ "$health" = healthy ] && curl --fail --silent http://127.0.0.1:47823/api/health > /tmp/devboard-health.json; then return 0; fi
              if [ "$attempt" -eq 60 ]; then docker logs "$container"; docker inspect "$container"; exit 1; fi
              sleep 2
            done
          }
          run_app
          wait_healthy
          docker run -d --name "$proxy" --network "$network" --ip 172.30.87.2 \
            --network-alias reverse-proxy --network-alias devboard.example.test \
            -p 127.0.0.1:47824:443 \
            -v "$GITHUB_WORKSPACE/deploy/reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$cert_directory:/etc/nginx/certs:ro" nginx:stable-alpine >/dev/null
          for attempt in $(seq 1 30); do
            if curl --insecure --fail --silent -H 'Host: devboard.example.test' \
              https://127.0.0.1:47824/api/health >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then docker logs "$proxy"; exit 1; fi
            sleep 1
          done
          forged_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Host: devboard.example.test' -H 'X-Forwarded-Proto: https' \
            http://127.0.0.1:47823/api/v1/auth/config || true)"
          test "$forged_status" = 403
          node -e 'const h=require("/tmp/devboard-health.json"); if (h.status !== "ok" || h.checks.http !== "ok" || h.checks.sqlite !== "ok" || h.checks.migrations !== "ok" || h.checks.events !== "ok") process.exit(1)'
          curl --insecure --fail --silent -H 'Host: devboard.example.test' https://127.0.0.1:47824/ | grep -qi '<html'
          curl --insecure --fail --silent -H 'Host: devboard.example.test' https://127.0.0.1:47824/api/v1/auth/config | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.data.authMode!=="web")process.exit(1)})'
          test "$(docker exec "$container" id -u)" != "0"
          test "$(docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' "$container")" = "no"
          docker exec "$container" sh -ec 'for b in codex cursor opencode grok grok-build frpc caddy; do if command -v "$b" >/dev/null 2>&1; then echo "unexpected runtime binary: $b" >&2; exit 1; fi; done'
          if docker port "$container" 47824/tcp | grep -q .; then echo 'Admin API must not be published' >&2; exit 1; fi
          docker cp deploy/scripts/container-state-smoke.mjs "$container:/tmp/container-state-smoke.mjs"
          docker cp deploy/scripts/proxy-sse-smoke.mjs "$container:/tmp/proxy-sse-smoke.mjs"
          docker exec -e NODE_EXTRA_CA_CERTS=/tmp/ci-fullchain.pem "$container" node /tmp/proxy-sse-smoke.mjs
          docker exec "$container" node /tmp/container-state-smoke.mjs seed
          backup_output="$(docker exec "$container" node apps/server/dist/ops.js backup)"
          backup_directory="$(node -e 'const r=JSON.parse(process.argv[1]);if(!r.ok)process.exit(1);process.stdout.write(r.directory)' "$backup_output")"
          backup_id="${backup_directory##*/}"
          test -n "$backup_id"
          docker restart "$container" >/dev/null
          wait_healthy
          docker cp deploy/scripts/container-state-smoke.mjs "$container:/tmp/container-state-smoke.mjs"
          docker exec "$container" node /tmp/container-state-smoke.mjs verify
          docker exec "$container" node /tmp/container-state-smoke.mjs mutate
          docker stop --time 30 "$container" >/dev/null
          docker rm "$container" >/dev/null
          docker run --rm --name "$restore_container" \
            --platform "$PLATFORM" --read-only --security-opt no-new-privileges:true --cap-drop ALL \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -e CODEXBOARD_ENV=production -e CODEXBOARD_AUTH_MODE=web \
            -e DEVBOARD_PUBLIC_ORIGIN=https://devboard.example.test \
            -e DEVBOARD_DATA_DIR=/var/lib/devboard \
            -v "$volume:/var/lib/devboard" \
            --entrypoint node devboard:smoke apps/server/dist/ops.js restore "/var/lib/devboard/backups/$backup_id"
          run_app
          wait_healthy
          test "$(docker inspect --format '{{.RestartCount}}' "$container")" = "0"
          docker cp deploy/scripts/container-state-smoke.mjs "$container:/tmp/container-state-smoke.mjs"
          docker cp deploy/scripts/proxy-sse-smoke.mjs "$container:/tmp/proxy-sse-smoke.mjs"
          docker exec "$container" node /tmp/container-state-smoke.mjs verify
          docker exec "$container" node apps/server/dist/ops.js verify "$backup_directory"
          echo "Container acceptance passed for $PLATFORM; business data survived restart and A→backup→mutate→restore→B verification."

  ssh-integration:
    name: Disposable SSH Host + Codex protocol
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build isolated OpenSSH fixture
        run: docker build -t devboard-ssh-fixture test/fixtures/sshd
      - name: Start disposable SSH host and create temporary test credentials
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="$RUNNER_TEMP/devboard-ssh-fixture"
          mkdir -m 700 "$fixture_dir"
          ssh-keygen -q -t ed25519 -N '' -f "$fixture_dir/ci_identity"
          ssh-keygen -q -t ed25519 -N '' -f "$fixture_dir/wrong_identity"
          ssh-keygen -q -t ed25519 -N '' -f "$fixture_dir/wrong_host_key"
          docker run -d --name devboard-ssh-fixture -p 127.0.0.1::22 devboard-ssh-fixture >/dev/null
          for attempt in $(seq 1 40); do
            if docker exec devboard-ssh-fixture test -s /etc/ssh/ssh_host_ed25519_key.pub; then break; fi
            if [ "$attempt" -eq 40 ]; then docker logs devboard-ssh-fixture; exit 1; fi
            sleep 1
          done
          docker cp "$fixture_dir/ci_identity.pub" devboard-ssh-fixture:/tmp/ci_identity.pub
          docker exec devboard-ssh-fixture sh -ec 'install -d -m 700 -o devboard -g devboard /home/devboard/.ssh && install -m 600 -o devboard -g devboard /tmp/ci_identity.pub /home/devboard/.ssh/authorized_keys'
          port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "22/tcp") 0).HostPort}}' devboard-ssh-fixture)"
          host_public_key="$(docker exec devboard-ssh-fixture awk '{print $1 " " $2}' /etc/ssh/ssh_host_ed25519_key.pub)"
          printf '[127.0.0.1]:%s %s\n' "$port" "$host_public_key" > "$fixture_dir/known_hosts"
          : > "$fixture_dir/empty_known_hosts"
          wrong_host_public_key="$(awk '{print $1 " " $2}' "$fixture_dir/wrong_host_key.pub")"
          printf '[127.0.0.1]:%s %s\n' "$port" "$wrong_host_public_key" > "$fixture_dir/changed_known_hosts"
          chmod 600 "$fixture_dir/known_hosts" "$fixture_dir/empty_known_hosts" "$fixture_dir/changed_known_hosts"
          echo "DEVBOARD_SSH_FIXTURE_PORT=$port" >> "$GITHUB_ENV"
          echo "DEVBOARD_SSH_FIXTURE_KEY=$fixture_dir/ci_identity" >> "$GITHUB_ENV"
          echo "DEVBOARD_SSH_FIXTURE_WRONG_KEY=$fixture_dir/wrong_identity" >> "$GITHUB_ENV"
          echo "DEVBOARD_SSH_FIXTURE_KNOWN_HOSTS=$fixture_dir/known_hosts" >> "$GITHUB_ENV"
          echo "DEVBOARD_SSH_FIXTURE_EMPTY_KNOWN_HOSTS=$fixture_dir/empty_known_hosts" >> "$GITHUB_ENV"
          echo "DEVBOARD_SSH_FIXTURE_CHANGED_KNOWN_HOSTS=$fixture_dir/changed_known_hosts" >> "$GITHUB_ENV"
          echo "DEVBOARD_SSH_FIXTURE_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "DEVBOARD_SSH_FIXTURE_USERNAME=devboard" >> "$GITHUB_ENV"
          echo "DEVBOARD_SSH_FIXTURE_WORKSPACE=/home/devboard/workspace" >> "$GITHUB_ENV"
      - name: Verify remote Git, authentication failure and Codex stdio protocol
        run: |
          set -euo pipefail
          ssh_options=(-T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UpdateHostKeys=no -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$DEVBOARD_SSH_FIXTURE_KNOWN_HOSTS" -o ConnectTimeout=5 -p "$DEVBOARD_SSH_FIXTURE_PORT")
          remote_root="$(ssh "${ssh_options[@]}" -i "$DEVBOARD_SSH_FIXTURE_KEY" devboard@127.0.0.1 'git -C /home/devboard/workspace rev-parse --show-toplevel')"
          test "$remote_root" = /home/devboard/workspace
          if ssh "${ssh_options[@]}" -i "$DEVBOARD_SSH_FIXTURE_WRONG_KEY" devboard@127.0.0.1 'true' >/dev/null 2>&1; then
            echo 'unexpected SSH authentication success with wrong key' >&2
            exit 1
          fi
          npm run build -w @codexboard/contracts
          npm run build -w @codexboard/server
          npm run test:ssh-integration -w @codexboard/server
      - name: Disposable SSH verification summary and cleanup
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          {
            echo '### Disposable SSH Host + Codex protocol'
            echo
            echo '| Gate | Result |'
            echo '|---|---|'
            echo "| Job | $JOB_RESULT |"
            echo '| Host | disposable OpenSSH container; no production key/account |'
            echo '| Protocol | real SSH stdio transport + fake Codex App Server |'
            echo '| Checks | trusted/unknown/changed host key, auth failure, version discovery, session resume, streaming, approval and completion |'
          } >> "$GITHUB_STEP_SUMMARY"
          docker rm -f devboard-ssh-fixture >/dev/null 2>&1 || true
          if [ -n "${RUNNER_TEMP:-}" ]; then rm -f "$RUNNER_TEMP/devboard-ssh-fixture/ci_identity" "$RUNNER_TEMP/devboard-ssh-fixture/ci_identity.pub" "$RUNNER_TEMP/devboard-ssh-fixture/wrong_identity" "$RUNNER_TEMP/devboard-ssh-fixture/wrong_identity.pub" "$RUNNER_TEMP/devboard-ssh-fixture/wrong_host_key" "$RUNNER_TEMP/devboard-ssh-fixture/wrong_host_key.pub" "$RUNNER_TEMP/devboard-ssh-fixture/known_hosts" "$RUNNER_TEMP/devboard-ssh-fixture/empty_known_hosts" "$RUNNER_TEMP/devboard-ssh-fixture/changed_known_hosts"; fi

  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [smoke, ssh-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/404404/devboard
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=preview,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Publish image digest summary
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image_ref="$(head -n 1 <<< "$IMAGE_TAGS")"
          docker pull --quiet --platform linux/amd64 "$image_ref"
          size_amd64="$(docker image inspect --format '{{.Size}}' "$image_ref")"
          docker pull --quiet --platform linux/arm64 "$image_ref"
          size_arm64="$(docker image inspect --format '{{.Size}}' "$image_ref")"
          {
            echo '### Container publish'
            echo
            echo '| Result | Value |'
            echo '|---|---|'
            echo '| Status | PASS |'
            echo '| Architectures | linux/amd64, linux/arm64 |'
            echo "| Uncompressed image size (amd64) | $size_amd64 bytes |"
            echo "| Uncompressed image size (arm64) | $size_arm64 bytes |"
            while IFS= read -r tag; do [ -z "$tag" ] || printf '| Tag | `%s` |\n' "$tag"; done <<< "$IMAGE_TAGS"
            printf '| Digest | `%s` |\n' "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Multi-architecture container image: `ghcr.io/404404/devboard:<version>`
            Architectures: `linux/amd64`, `linux/arm64`.
            See the Container workflow summary for the published image digest.
